spring.application.name=puntosdeventa
server.port=8080


# ============================================================================
# REDIS CONFIGURATION (Caché para PuntoVenta y Costos)
# ============================================================================
spring.cache.type=redis
spring.cache.cache-names=
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=60000


# ============================================================================
# MONGODB CONFIGURATION (Persistencia para Acreditaciones)
# ============================================================================
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:challenge}
spring.data.mongodb.auto-index-creation=true


# ============================================================================
# LOGGING
# ============================================================================
logging.level.root=INFO
logging.level.com.challenge=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

